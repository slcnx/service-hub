[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "service-hub"
version = "1.0.0"
description = "Foreground process manager for macOS with terminal colored logs, systemd-like supervision, and full RESTful HTTP CRUD."
readme = "README.md"
authors = [{ name = "slcnx" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "psutil>=5.9.0",
    "pydantic>=2.0.0",
]

[project.scripts]
service-hub = "service_hub:main"

[project.urls]
Homepage = "https://github.com/slcnx/service-hub"
Repository = "https://github.com/slcnx/service-hub"
